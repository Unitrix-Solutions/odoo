services:
  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${ODOO_PORT:-8069}:8069"
      - "${ODOO_LONGPOLL_PORT:-8072}:8072"
    environment:
      - ODOO_DB_HOST=db
      - ODOO_DB_PORT=5432
      - ODOO_DB_USER=${ODOO_DB_USER:-odoo}
      - ODOO_DB_PASSWORD=${ODOO_DB_PASSWORD:-odoo_password}
      - ODOO_DB_NAME=${ODOO_DB_NAME:-odoo}
      - ODOO_ADMIN_PASS=${ODOO_ADMIN_PASS:-admin123}
    volumes:
      - odoo-data:/var/lib/odoo
      - odoo-logs:/var/log/odoo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${ODOO_DB_USER:-odoo}
      - POSTGRES_PASSWORD=${ODOO_DB_PASSWORD:-odoo_password}
      - POSTGRES_DB=${ODOO_DB_NAME:-odoo}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ODOO_DB_USER:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  odoo-data:
  odoo-logs:
  postgres-data:
